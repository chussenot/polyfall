[tools]
rust = { version = "latest", mr_boxington = true }
mr-boxington = "latest"
watchexec = "latest"
"pipx:mkdocs" = "1.6.1"

[tasks.run]
description = "Play the game (optimised build)"
run = "cargo run --release"

[tasks.dev]
description = "Run the game and restart it whenever the source changes"
run = "watchexec --restart --exts rs,toml -- cargo run"

[tasks.test]
description = "Run the game-logic tests (no window needed)"
# all features: the staging keys of the sound bench are tested too
run = "cargo test --all-features"

[tasks.lint]
description = "Check formatting and lints"
run = ["cargo fmt --check", "cargo clippy --all-targets --all-features -- -D warnings"]

[tasks.fmt]
description = "Format the source"
run = "cargo fmt"

[tasks.check]
description = "Everything to pass before a commit: lint, tests, docs"
depends = ["lint", "test", "docs-build"]

[tasks.build]
description = "Build the optimised binary at target/release/polyfall"
run = "cargo build --release"

[tasks.docs]
description = "Serve the documentation locally with live reload"
run = "mkdocs serve"

[tasks.docs-build]
description = "Build the documentation and fail on any warning"
run = "mkdocs build --strict"

[tasks.screenshot]
description = "Capture the running game window to docs/assets/screenshot.png (needs ImageMagick and X11/XWayland)"
run = "import -window Polyfall docs/assets/screenshot.png"

[tasks.audio]
description = "Render the scores in audio/ to assets/ (needs sonomorph-render and ffmpeg)"
# 44100 Hz is the rate macroquad mixes at; any other rate goes through its nearest-neighbour resampler
run = """
# music is long: Ogg Vorbis
for s in theme level_up game_over; do
  sonomorph-render audio/$s.score target/$s.wav 44100
  ffmpeg -y -loglevel error -i target/$s.wav -c:a libvorbis -q:a 5 assets/$s.ogg
done
# effects are short, and the soft-drop loop must keep its exact length: WAV, as rendered
mkdir -p assets/sfx
for f in audio/sfx/*.score; do
  sonomorph-render $f assets/sfx/$(basename $f .score).wav 44100
done
"""

[tasks.sound-check]
description = "Check the sound files and the room left in the mix (needs python3 with numpy)"
run = "python3 tools/sound/bench.py check"

[tasks.sound-record]
description = "Run the game on a virtual sound card, press its keys and check what it played (Linux; see tools/sound/README.md)"
run = "tools/sound/record.sh --all"
