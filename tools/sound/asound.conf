# ALSA configuration for the game while record.sh runs it: its default sound card is the
# PulseAudio server that record.sh started for the take. Needs ALSA's PulseAudio plugin
# (Debian and Ubuntu: libasound2-plugins).
</usr/share/alsa/alsa.conf>
pcm.!default { type pulse }
ctl.!default { type pulse }
